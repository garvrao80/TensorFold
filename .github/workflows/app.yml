name: Studio planning picker validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 858c08824c3b6576c1b4c8d58d4b9cb2e8f7bd25
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable candidate
        run: test "$(git rev-parse HEAD)" = 858c08824c3b6576c1b4c8d58d4b9cb2e8f7bd25
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/mobile/package-lock.json
      - run: npm install --global --ignore-scripts npm@10.9.8
      - run: npm ci --ignore-scripts
      - run: npm --prefix mobile ci --ignore-scripts
      - name: Full desktop suite
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Mobile verification
        if: runner.os == 'Linux'
        run: npm run verify:mobile
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
